name: Validate casks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register checked-out tap
        id: setup
        uses: ./.github/actions/setup-tap
      - name: Test update selection
        run: python3 -m unittest discover -s tests
      - name: Check style
        run: brew style cravingmaker/tap
      - name: Audit casks and verify downloads
        run: brew audit --cask --strict --online --except=livecheck_version --tap cravingmaker/tap
      - name: Report upstream versions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: brew livecheck --cask --tap cravingmaker/tap
