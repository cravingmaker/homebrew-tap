name: Validate tap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register checked-out tap
        id: setup
        uses: ./.github/actions/setup-tap
      - name: Validate migration map
        run: python3 -m json.tool tap_migrations.json > /dev/null
      - name: Detect packages
        id: packages
        shell: zsh -f -e {0}
        run: |
          casks=(Casks/**/*.rb(N))
          formulae=(Formula/**/*.rb(N))
          echo "casks=${#casks}" >> "$GITHUB_OUTPUT"
          echo "formulae=${#formulae}" >> "$GITHUB_OUTPUT"
      - name: Check style
        if: steps.packages.outputs.casks != '0' || steps.packages.outputs.formulae != '0'
        run: brew style cravingmaker/tap
      - name: Audit casks and verify downloads
        if: steps.packages.outputs.casks != '0'
        run: brew audit --cask --strict --online --except=livecheck_version --tap cravingmaker/tap
      - name: Audit formulae
        if: steps.packages.outputs.formulae != '0'
        run: brew audit --formula --strict --online --tap cravingmaker/tap
      - name: Report upstream versions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.packages.outcome == 'success' && (steps.packages.outputs.casks != '0' || steps.packages.outputs.formulae != '0') }}
        run: brew livecheck --tap cravingmaker/tap
